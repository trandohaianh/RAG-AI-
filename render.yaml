# Render Blueprint — deploy 1-click: https://render.com/deploy
# Sau deploy: dán URL frontend vào README mục Live Demo

databases:
  - name: rag-postgres
    plan: free
    databaseName: rag_dw
    user: rag

services:
  - type: web
    name: rag-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Không đặt thì APP_ENV mặc định "development": /metrics mở công khai và các kiểm tra
      # cấu hình production (khoá ký, CORS) bị bỏ qua.
      - key: APP_ENV
        value: production
      - key: METRICS_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: MEDALLION_ENABLED
        value: "true"
      - key: POSTGRES_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      # Sau deploy: set = https://<tên-rag-web>.onrender.com (trình duyệt gọi API qua /api cùng
      # origin nên CORS chỉ còn cần cho công cụ khác; vẫn bắt buộc ở production).
      - key: CORS_ORIGINS
        sync: false
      # URL công khai của API mà trình duyệt thấy (ảnh hiện trường): https://<tên-rag-web>.onrender.com/api
      - key: API_PUBLIC_URL
        sync: false

  - type: web
    name: rag-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # API đi qua proxy cùng origin /api (next.config.js). Không trỏ thẳng tới host của rag-api:
      # hai subdomain onrender.com là hai site khác nhau nên cookie đăng nhập không được gửi.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: rag-api
          property: host
