# Render Blueprint — deploy 1-click: https://render.com/deploy
# Sau deploy: dán URL frontend vào README mục Live Demo

databases:
  - name: rag-postgres
    plan: free
    databaseName: rag_dw
    user: rag

services:
  - type: web
    name: rag-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Không đặt thì APP_ENV mặc định "development": /metrics mở công khai và các kiểm tra
      # cấu hình production (khoá ký, CORS) bị bỏ qua.
      - key: APP_ENV
        value: production
      # F1-A: chỉ đăng ký bằng lời mời admin tạo (tài khoản đầu tiên là ngoại lệ).
      - key: SIGNUP_MODE
        value: invite
      - key: METRICS_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: MEDALLION_ENABLED
        value: "true"
      - key: POSTGRES_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      # Dữ liệu ứng dụng (user, đội, ca sửa) PHẢI ở Postgres: web service free không có ổ đĩa, mọi
      # thứ ghi vào /app/data (SQLite mặc định) mất sau mỗi lần deploy/ngủ. Chroma, tài liệu tải
      # lên và ảnh hiện trường vẫn nằm trên ổ tạm: cần Render Disk (gói trả phí) để giữ chúng.
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      # Link đặt lại mật khẩu / xác thực email / widget nhúng: https://<tên-rag-web>.onrender.com
      # (API từ chối khởi động production nếu thiếu hoặc là localhost).
      - key: APP_PUBLIC_URL
        sync: false
      # Trần chi phí AI mặc định (chủ sản phẩm chọn 2026-11-17); 0 = không giới hạn.
      - key: LLM_DAILY_BUDGET_USD
        value: "2"
      - key: LLM_USER_DAILY_BUDGET_USD
        value: "0.2"
      # Số proxy tin cậy trước API, để giới hạn đăng nhập theo IP thật thay vì IP của edge Render
      # (xem auth/ratelimit.py). Kiểm tra trên bản deploy thật trước khi đặt (README deploy).
      - key: TRUSTED_PROXY_HOPS
        sync: false
      # Sau deploy: set = https://<tên-rag-web>.onrender.com (trình duyệt gọi API qua /api cùng
      # origin nên CORS chỉ còn cần cho công cụ khác; vẫn bắt buộc ở production).
      - key: CORS_ORIGINS
        sync: false
      # URL công khai của API mà trình duyệt thấy (ảnh hiện trường): https://<tên-rag-web>.onrender.com/api
      - key: API_PUBLIC_URL
        sync: false

  - type: web
    name: rag-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # API đi qua proxy cùng origin /api (next.config.js). Không trỏ thẳng tới host của rag-api:
      # hai subdomain onrender.com là hai site khác nhau nên cookie đăng nhập không được gửi.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      # URL CÔNG KHAI của rag-api: https://rag-api-xxxx.onrender.com. Không dùng fromService
      # property: host — đó là hostname mạng nội bộ (không TLS; service free không nhận được
      # lưu lượng nội bộ), nên mọi request /api/* sẽ hỏng. Đặt trước lần build đầu: rewrites của
      # Next được tính lúc build.
      - key: API_PROXY_TARGET
        sync: false
