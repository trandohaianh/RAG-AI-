name: Deploy

# Sau khi CI xanh trên main: SSH vào VM, kéo code mới, build lại, chạy smoke test.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key), tuỳ chọn DEPLOY_PORT.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Chỉ deploy khi CI xanh cho một lần PUSH lên main (không phải lần chạy CI của PR).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Check secrets
        id: guard
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::warning::Chưa cấu hình DEPLOY_HOST — bỏ qua deploy"; fi
      - name: Deploy over SSH
        if: steps.guard.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # Đúng commit mà CI vừa kiểm, không phải "origin/main lúc này" (có thể có commit mới chưa qua CI).
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          # Ghim khoá host khi có secret DEPLOY_KNOWN_HOSTS (ssh-keyscan -p PORT HOST); không có thì
          # giữ hành vi cũ accept-new (tin khoá ở lần kết nối đầu).
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > known_hosts
            HOSTOPT="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts"
          else
            HOSTOPT="-o StrictHostKeyChecking=accept-new"
          fi
          ssh -i key -p "$PORT" $HOSTOPT "$USER@$HOST" \
            "bash -lc 'cd ~/fieldops && DEPLOY_SHA=$DEPLOY_SHA bash deploy/cloud/deploy.sh'"
          rm -f key known_hosts
