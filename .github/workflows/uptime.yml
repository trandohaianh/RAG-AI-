name: Uptime

# Monitor dự phòng miễn phí: mỗi giờ gọi /api/health/ready. Lỗi → GitHub gửi email
# cho người có quyền repo. Biến repo: PUBLIC_URL (VD https://fieldops.duckdns.org).
on:
  schedule:
    - cron: "7 * * * *"   # mỗi giờ (repo private: 2.000 phút Actions free/tháng)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Readiness
        env:
          URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::Chưa đặt biến PUBLIC_URL"; exit 0; fi
          for i in 1 2 3; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 20 "$URL/api/health/ready") || code=000
            [ "$code" = "200" ] && { echo "OK $code"; cat body.txt; exit 0; }
            echo "Lần $i: $code"; cat body.txt || true; sleep 20
          done
          echo "::error::$URL không sẵn sàng"; exit 1
