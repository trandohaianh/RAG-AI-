user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65s; keepalive_requests 10000;
    client_header_timeout 10s; client_body_timeout 30s;
    client_body_buffer_size 128k; client_max_body_size 5m;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;
    # Request bodies, query strings, JWTs, phone numbers and API keys never enter logs.
    log_format audit escape=json '{"time":"$time_iso8601","host":"$host","uri":"$uri","status":$status,"seconds":$request_time}';
    access_log /dev/stdout audit buffer=64k flush=1s;
    gzip on; gzip_comp_level 3; gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    map $http_upgrade $connection_upgrade { default close; ~*^websocket$ upgrade; }
    upstream streamlit { zone streamlit 64k; server streamlit-ui:8501 resolve; keepalive 32; }
    upstream api { zone api 64k; server fastapi-backend:8000 resolve; keepalive 32; }
    upstream call_policy { zone call_policy 64k; server telecom-grpc:50051 resolve; keepalive 128; }
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:TLS:10m; ssl_session_timeout 1d; ssl_session_tickets off; ssl_early_data off;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_next_upstream off;
    server { listen 127.0.0.1:8080; location = /health { access_log off; return 200 'ok'; } }
    server { listen 80 default_server; server_name _; return 444; }
    server { listen 80; server_name ${TELECOM_DOMAIN} ${EDU_DOMAIN}; return 308 https://$host$request_uri; }
    server { listen 443 ssl default_server; http2 on; ssl_reject_handshake on; return 444; }
    server {
        listen 443 ssl; http2 on; server_name ${TELECOM_DOMAIN};
        if ($ssl_server_name != $host) { return 421; }
        # Core-network callers must have both a client certificate and the application API key.
        ssl_client_certificate /etc/nginx/tls/local-ca.crt;
        ssl_verify_client on;
        location = /telecom.v1.CallPolicy/CheckCallAllowed {
            client_max_body_size 2k;
            grpc_pass grpc://call_policy;
            grpc_set_header x-api-key $http_x_api_key;
            grpc_set_header X-Forwarded-For $remote_addr;
            grpc_connect_timeout 20ms;
            grpc_read_timeout 30ms;
            grpc_send_timeout 30ms;
            grpc_next_upstream off;
            grpc_socket_keepalive on;
            gzip off;
        }
        location / { return 404; }
    }
    server {
        listen 443 ssl; http2 on; server_name ${EDU_DOMAIN};
        if ($ssl_server_name != $host) { return 421; }
        location /v1/ { proxy_pass http://api; }
        location = /health { proxy_pass http://api; }
        location = /ready { proxy_pass http://api; }
        location = /docs { return 404; }
        location = /openapi.json { return 404; }
        location = /metrics { return 404; }
        # Streamlit uses a persistent WebSocket at /_stcore/stream.
        location = /_stcore/stream {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off; proxy_read_timeout 3600s; proxy_send_timeout 3600s;
        }
        location / {
            proxy_pass http://streamlit;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off; proxy_read_timeout 3600s;
        }
    }
}
