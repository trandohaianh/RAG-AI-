# Render ONLY the named deployment variables; all $request/$proxy variables stay literal.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;
worker_shutdown_timeout 25s;

events { worker_connections 4096; multi_accept on; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    ssi off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;
    reset_timedout_connection on;
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    log_format audit escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote":"$remote_addr","host":"$host","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"elapsed":$request_time}';
    # No query strings, Authorization headers, API keys or request bodies in logs.
    access_log /var/log/nginx/access.log audit buffer=64k flush=1s;
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    # Compress static assets; keep authentication JSON and all SSE uncompressed.
    gzip_types text/css application/javascript application/xml image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    upstream rag_api { zone rag_api 64k; server rag-backend:8000 resolve; keepalive 32; }
    upstream rag_web { zone rag_web 64k; server rag-frontend:3000 resolve; keepalive 32; }
    upstream telecom_api { zone telecom_api 64k; server telecom-api:8000 resolve; keepalive 32; }
    upstream edu_api { zone edu_api 64k; server edu-api:8000 resolve; keepalive 32; }
    map $http_upgrade $safe_upgrade { default ""; ~*^websocket$ websocket; }
    map $safe_upgrade $connection_upgrade { default ""; websocket upgrade; }
    limit_req_zone $binary_remote_addr zone=rag_requests:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:secp256r1;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;
    ssl_early_data off;
    ssl_certificate ${TLS_CERT_FILE};
    ssl_certificate_key ${TLS_KEY_FILE};

    add_header Strict-Transport-Security "max-age=${HSTS_MAX_AGE}" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=()" always;
    # Frame policy/CORS remain app-specific: the RAG widget is legitimately embeddable.

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # This gateway is the sole public ingress: overwrite, do not append attacker-supplied XFF.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Forwarded "";
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $safe_upgrade;
    proxy_connect_timeout 2s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 64k;
    proxy_request_buffering on;
    proxy_cache off;
    proxy_next_upstream off;  # Do not replay mutating requests/LLM calls.

    server {
        listen 127.0.0.1:8080;
        server_name _;
        access_log off;
        location = /health { default_type text/plain; return 200 "ok\n"; }
        location / { return 404; }
    }
    server { listen 80 default_server; listen [::]:80 default_server; server_name _; return 444; }
    server {
        listen 80; listen [::]:80;
        server_name ${RAG_DOMAIN} ${RAG_API_DOMAIN} ${TELECOM_DOMAIN} ${EDU_DOMAIN};
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
        # $host has already matched one exact configured hostname in this server.
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 443 ssl default_server; listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }
    server {
        listen 443 ssl; listen [::]:443 ssl; http2 on;
        server_name ${RAG_DOMAIN};
        if ($ssl_server_name != $host) { return 421; }
        location ~ /\. { return 404; }
        location / { proxy_pass http://rag_web; }
    }
    server {
        listen 443 ssl; listen [::]:443 ssl; http2 on;
        server_name ${RAG_API_DOMAIN};
        if ($ssl_server_name != $host) { return 421; }
        limit_req zone=rag_requests burst=80 nodelay;
        limit_conn client_connections 100;
        location = /metrics { return 404; }
        location = /openapi.json { return 404; }
        location = /redoc { return 404; }
        location = /docs { return 404; }
        location ~ /\. { return 404; }
        location ~ ^/(chat/|embed/chat$) {
            proxy_pass http://rag_api;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;  # Idle-between-frames timeout, not total answer deadline.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
        }
        location / { proxy_pass http://rag_api; }
    }
    server {
        listen 443 ssl; listen [::]:443 ssl; http2 on;
        server_name ${TELECOM_DOMAIN};
        if ($ssl_server_name != $host) { return 421; }
        client_max_body_size 4k;
        # No generic request rate limiter on the call-permission hot path.
        location = /v1/check-call { proxy_pass http://telecom_api; proxy_read_timeout 2s; gzip off; }
        location = /health { proxy_pass http://telecom_api; }
        location / { return 404; }
    }
    server {
        listen 443 ssl; listen [::]:443 ssl; http2 on;
        server_name ${EDU_DOMAIN};
        if ($ssl_server_name != $host) { return 421; }
        location = /metrics { return 404; }
        location = /openapi.json { return 404; }
        location = /docs { return 404; }
        location = /redoc { return 404; }
        location ~ /\. { return 404; }
        location / { proxy_pass http://edu_api; }
    }
}
